name: Run IG Bio Scraper

# Second, separate "Run workflow" button (Actions tab) for fetching
# Instagram bio data for handles already found by the keyword scraper.
# Uses the same repo secrets -- same spreadsheet, same GAS URL (see
# README: "Keyword", "Hasil", and "Bio" are tabs in ONE spreadsheet).

on:
  workflow_dispatch:
    inputs:
      max_bios:
        description: "How many Instagram handles to fetch bios for this run"
        required: false
        default: "200"
  schedule:
    - cron: "30 3 * * *" # runs ~1.5h after the keyword scraper's daily run

concurrency:
  group: ig-bio-scraper
  cancel-in-progress: false

jobs:
  scrape-bios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bio scraper
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          GAS_SHARED_TOKEN: ${{ secrets.GAS_SHARED_TOKEN }}
          MAX_BIOS_PER_RUN: ${{ github.event.inputs.max_bios || '200' }}
        run: python src/scrape_bios.py
