name: Run Post Owner Resolver

# Third, separate "Run workflow" button (Actions tab) -- fixes rows stuck
# with a placeholder Instagram Handle ("@p"/"@reel") by fetching each
# post's own page and reading its og:title meta tag. Uses the same repo
# secrets as the other two workflows (same spreadsheet, same GAS URL).
#
# Best run AFTER "Run IG Keyword Scraper" has produced some @p/@reel rows
# to work through -- it's a no-op (finishes instantly) if the queue is
# empty.

on:
  workflow_dispatch:
    inputs:
      max_post_owners:
        description: "How many @p/@reel posts to resolve this run"
        required: false
        default: "200"
  schedule:
    - cron: "0 5 * * *" # runs ~3h after the keyword scraper's daily run

concurrency:
  group: ig-post-owner-resolver
  cancel-in-progress: false

jobs:
  resolve-post-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post owner resolver
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          GAS_SHARED_TOKEN: ${{ secrets.GAS_SHARED_TOKEN }}
          MAX_POST_OWNERS_PER_RUN: ${{ github.event.inputs.max_post_owners || '200' }}
        run: python src/resolve_post_owners.py
